name: Bug report
description: Report a reproducible problem with image-to-gcode
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve image-to-gcode. Search existing issues first and remove personal or sensitive information from anything you upload. Never run unreviewed G-code on real equipment.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed personal, confidential, and machine-sensitive information from uploaded files.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Briefly describe what went wrong.
      placeholder: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that causes the problem.
      placeholder: |
        1. Import ...
        2. Select ...
        3. Change ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Brave 151, Chrome 151, Firefox 142
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Bazzite Linux, Windows 11, macOS 15
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Conversion mode
      options:
        - Raster scanline
        - Contour / outline
        - Grayscale engraving
        - G-code inspector or preview
        - Machine profile or settings
        - Other
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Machine profile and relevant settings
      description: Include the profile type and only the settings needed to reproduce the issue.
      placeholder: Generic CNC, pen plotter, laser-style profile, dimensions, origin, feeds, offsets, passes, or other relevant settings.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Minimal reproduction files
      description: Attach the smallest sanitized source image and generated G-code that reproduce the problem, when relevant. If files are not relevant or cannot be shared, explain why.
      placeholder: Drag files here, paste a minimal example, or explain why no files are attached.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Add sanitized screenshots or a short recording if they help show the problem.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include console errors, frequency, performance measurements, or other useful details.
